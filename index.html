<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jimothy's Big Day Out</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-container"></div>
    <div id="hud">
      <div id="score">SCORE 0</div>
      <div id="fat">FAT 0</div>
      <div id="heat">HEAT ☆☆☆☆☆</div>
      <div id="combo"></div>
    </div>
    <div id="popups"></div>
    <div id="flash"></div>
    <div id="game-over" class="hidden">
      <h1>JIMOTHY WAS CAPTURED</h1>
      <p id="final-score"></p>
      <p id="best-score"></p>
      <button id="restart-btn">ONE MORE DAY (R)</button>
    </div>
    <div id="diag"></div>
    <div id="input-hint" class="hidden">
      ⚠️ KEYBOARD NOT DETECTED — click the game once.<br />
      Still stuck? Open <b>localhost:3000</b> in a real browser tab (not an editor preview).
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
